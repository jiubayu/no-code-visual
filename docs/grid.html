<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>grid</title>
  <style>
    #root {
      width: 500px;
      height: 500px;
      border:1xox solid red;
      display: grid;
      /* grid: auto-flow minmax(50px, 1fr) / 1fr 1fr 1fr; */
      /* grid: auto-flow dense / 40px 40px 1fr; */
      grid: repeat(3, 80px) / auto-flow;
    }
    #root > div {
      width: 100px;
      height: 100px;
      border:1px solid blue;
    }
  </style>
</head>
<body>
  <p>grid 是一个 CSS 简写属性，可以用来设置以下属性：</p>
  <p>显式网格属性: grid-template-rows, grid-template-columns 和 grid-template-areas</p>
  <p>隐式网格属性 grid-auto-rows、grid-auto-columns 和 grid-auto-flow</p>
  <p>间距属性 grid-column-gap 和 grid-row-gap</p>

  <div id="root">
    <div></div>
    <div></div>
    <div></div>
  </div>
</body>
</html>
